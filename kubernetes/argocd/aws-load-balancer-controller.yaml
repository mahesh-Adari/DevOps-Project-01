apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.14.0
    helm:
      releaseName: aws-load-balancer-controller
      values: |
        clusterName: devops-eks
        region: us-east-1
        vpcTags:
          Name: devops-vpc
          Project: DevOps-Lab
          Environment: Production-Lab
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
        replicaCount: 2
        nodeSelector:
          workload: platform
        tolerations:
          - key: workload
            operator: Equal
            value: platform
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
