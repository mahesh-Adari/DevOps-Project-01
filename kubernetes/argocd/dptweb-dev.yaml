apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dptweb-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mahesh-Adari/DevOps-Project-01.git
    targetRevision: main
    path: kubernetes/apps/dptweb/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
