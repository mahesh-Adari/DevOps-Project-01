apiVersion: apps/v1
kind: Deployment
metadata:
  name: dptweb
  labels:
    app: dptweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dptweb
  template:
    metadata:
      labels:
        app: dptweb
    spec:
      nodeSelector:
        workload: application
      tolerations:
        - key: workload
          operator: Equal
          value: application
          effect: NoSchedule
      containers:
        - name: dptweb
          image: REPLACE_WITH_ECR_URI:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
