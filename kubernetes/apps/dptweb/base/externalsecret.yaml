apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: java-login-app-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: java-login-app-db
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: devops-project-01/application-db
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: devops-project-01/application-db
        property: password