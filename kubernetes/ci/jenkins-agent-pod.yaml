apiVersion: v1
kind: Pod

metadata:
  labels:
    app: jenkins-agent
    workload: ci

spec:
  serviceAccountName: jenkins-agent
  automountServiceAccountToken: true
  restartPolicy: Never

  nodeSelector:
    workload: ci

  tolerations:
    - key: workload
      operator: Equal
      value: ci
      effect: NoSchedule

  securityContext:
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: maven
      image: maven:3.9.11-eclipse-temurin-21
      command: ["sleep"]
      args: ["99d"]
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi

    - name: sonar
      image: sonarsource/sonar-scanner-cli:latest
      command: ["sleep"]
      args: ["99d"]
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

    - name: buildkit
      image: moby/buildkit:rootless
      command: ["sh", "-c"]
      args:
        - |
          exec rootlesskit buildkitd \
            --addr unix:///run/user/1000/buildkit/buildkitd.sock \
            --oci-worker-no-process-sandbox
      env:
        - name: BUILDKITD_FLAGS
          value: "--oci-worker-no-process-sandbox"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        seccompProfile:
          type: Unconfined
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi

    - name: trivy
      image: aquasec/trivy:latest
      command: ["sleep"]
      args: ["99d"]
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

    - name: awscli
      image: amazon/aws-cli:2
      command: ["sh", "-c"]
      args: ["sleep 99d"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    - name: git
      image: alpine/git:latest
      command: ["sh", "-c"]
      args: ["sleep 99d"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

