apiVersion: v1
kind: Pod

spec:

  automountServiceAccountToken: false
  
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    
  containers:

    - name: maven
      image: maven:3.9.11-eclipse-temurin-21
      command:
        - sleep
      args:
        - 99d
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "2Gi"

    - name: sonar
      image: sonarsource/sonar-scanner-cli:latest
      command:
        - sleep
      args:
        - 99d
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"

    - name: docker
      image: docker:29-dind
      securityContext: 
        privileged: true
        runAsUser: 0
        runAsGroup: 0
      command:
        - dockerd
      args:
        - --host=unix:///var/run/docker-shared/docker.sock
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker-shared
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "2"
          memory: "2Gi"
        
    - name: trivy
      image: aquasec/trivy:latest
      command:
        - sleep
      args:
        - 99d
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker-shared
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
        
  volumes:
    - name: docker-socket
      emptyDir: {}
